name: Build Docker image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker-image.yml
      - .github/scripts/**
  schedule:
    # Mondays at 09:17 Asia/Shanghai (01:17 UTC).
    - cron: '17 1 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if the latest Caddy version is already published
        type: boolean
        default: false

permissions:
  contents: read

# Serialize publishing so an older run cannot overwrite a newer latest tag.
concurrency:
  group: caddy-tencentcloud-publish
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      image: ${{ steps.release.outputs.image }}
      should_build: ${{ steps.release.outputs.should_build }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Test update detection
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Check latest stable Caddy release and published image
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_REBUILD: ${{ github.event_name == 'push' || inputs.force }}
        run: python3 .github/scripts/check_update.py

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.check.outputs.image }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for verification
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          pull: true
          # Refresh the DNS module even on a forced rebuild of the same release.
          no-cache-filters: builder
          build-args: CADDY_VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify Caddy version and Tencent Cloud DNS module
        shell: bash
        run: |
          set -euo pipefail
          actual="$(docker run --rm --entrypoint caddy "$IMAGE:$VERSION" version)"
          test "${actual%% *}" = "v$VERSION"
          docker run --rm --entrypoint caddy "$IMAGE:$VERSION" list-modules \
            | grep -Fx 'dns.providers.tencentcloud'

      - name: Publish verified image
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
          # The version tag is the success marker; publish it last so failures retry.
          docker push "$IMAGE:$VERSION"
          echo "Published Caddy $VERSION: \`$IMAGE:latest\` and \`$IMAGE:$VERSION\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify published version can be detected by weekly checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: .github/scripts
        run: |
          python3 - <<'PY'
          import os
          from check_update import image_exists
          assert image_exists(
              os.environ['GITHUB_REPOSITORY'].lower(), os.environ['VERSION'],
              os.environ['GITHUB_ACTOR'], os.environ['GH_TOKEN'],
          ), 'Published version tag is missing from GHCR'
          PY

  keepalive:
    # Public repositories otherwise lose scheduled runs after 60 inactive days.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Keep weekly checks active after 45 days without commits
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const repo = context.repo;
            const branch = context.payload.repository.default_branch;
            const { data: head } = await github.rest.repos.getBranch({ ...repo, branch });
            const lastCommit = Date.parse(head.commit.commit.committer.date);
            if (!Number.isFinite(lastCommit)) throw new Error('Invalid commit date');
            if (Date.now() - lastCommit < 45 * 24 * 60 * 60 * 1000) {
              core.info('Recent repository activity; no keepalive commit needed.');
              return;
            }
            const { data: commit } = await github.rest.git.createCommit({
              ...repo,
              message: 'chore: keep weekly Caddy update checks active [skip ci]',
              tree: head.commit.commit.tree.sha,
              parents: [head.commit.sha],
            });
            // Never force-push over a concurrent change. GITHUB_TOKEN does not
            // trigger another push workflow, and this commit changes no files.
            await github.rest.git.updateRef({
              ...repo, ref: `heads/${branch}`, sha: commit.sha, force: false,
            });
